[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nexova-supplier-directory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
    "tinydb>=4.8,<5",
    "pydantic>=2.9,<3",
    "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[project.scripts]
seed = "services.api.seed:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]
namespaces = true